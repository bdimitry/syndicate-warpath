name: Publish SyndiCate guide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SYNDICATE_SITE_URL: ${{ vars.SYNDICATE_SITE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy Pages using REST artifact metadata
        uses: actions/github-script@v7
        id: deployment
        timeout-minutes: 12
        env:
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const repository = context.repo;
            const pause = () => new Promise(resolve => setTimeout(resolve, 5000));
            let artifact;
            for (let attempt = 0; attempt < 12; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                ...repository, run_id: context.runId, name: process.env.ARTIFACT_NAME
              });
              artifact = data.artifacts.find(item => item.name === process.env.ARTIFACT_NAME && !item.expired);
              if (artifact) break;
              await pause();
            }
            if (!artifact) throw new Error('Pages artifact metadata did not become available');
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...repository,
              artifact_id: artifact.id,
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken()
            });
            core.setOutput('page_url', deployment.page_url);
            const deploymentId = deployment.id || deployment.status_url.split('/').pop();
            const failures = new Set(['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            for (let attempt = 0; attempt < 120; attempt++) {
              await pause();
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...repository, deployment_id: deploymentId
              });
              if (data.status === 'succeed') return;
              if (failures.has(data.status)) throw new Error(`Pages deployment failed: ${data.status}`);
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', {
              ...repository, deployment_id: deploymentId
            });
            throw new Error('Pages deployment timed out');
